<body class="bg-black text-white antialiased overflow-hidden">
  <div id="root" class="h-full w-full"></div>

  <!-- Force disable service workers and clear cache storages for instant cross-device updates -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(names => {
        for (let name of names) {
          caches.delete(name);
        }
      });
    }
  </script>

  <!-- 100% UNIFIED SINGLE-FILE REACT ENGINE (BABEL COMPILATION) -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Circuits config with precise port mapping
    const CIRCUITS = {
      "lucas-guerrero": {
        id: "lucas-guerrero",
        name: "Lucas Guerrero (Valencia)",
        url: "https://live.apex-timing.com/kartodromo-lucas-guerrero/",
        configPort: 9950,
        columnMap: {
          no: 'c4',
          dr: 'c5',
          llp: 'c6',
          gap: 'c7',
          int: 'c8',
          blp: 'c9',
          tlp: 'c10'
        }
      },
      "campillos": {
        id: "campillos",
        name: "Kartcenter Campillos (Málaga)",
        url: "https://www.apex-timing.com/live-timing/kartcenter-campillos/",
        configPort: 9370,
        columnMap: {
          no: 'c4',
          dr: 'c5',
          llp: 'c9',
          gap: 'c11',
          int: 'c12',
          blp: 'c10',
          tlp: 'c13'
        }
      }
    };

    // =========================================================================
    // 1. TELEMETRY CONNECTOR & PARSER
    // =========================================================================
    class ApexTimingService {
      constructor() {
        this.listeners = new Set();
        this.pollTimerId = null;
        
        // Load configurations
        this.targetDriverName = localStorage.getItem('kart_target_driver_name') || 'Alex R.';
        this.activeCircuitId = localStorage.getItem('kart_active_circuit_id') || 'lucas-guerrero';
        this.targetKart = 14;

        this.configHost = 'live-data.apex-timing.com';
        this.pollInit = 1;
        this.pollIndex = 0;
        this.pollCounter = 0;
        this.randomSessionId = Math.floor(Math.random() * 1000000000) || 1;
        this.activeProxyIndex = 0;

        this.corsProxies = [
          (url) => `https://corsproxy.io/?${encodeURIComponent(url)}`,
          (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
          (url) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`
        ];

        this.sessionRows = new Map();

        this.state = {
          activeCircuitId: this.activeCircuitId,
          trackName: CIRCUITS[this.activeCircuitId].name,
          sessionName: "Esperando tanda en vivo...",
          flagStatus: "GREEN",
          totalLaps: 0,
          isLiveConnected: false,
          targetDriverName: this.targetDriverName,
          matchedKartNumber: 14,
          drivers: []
        };
      }

      subscribe(callback) {
        this.listeners.add(callback);
        callback(this.state);
        return () => this.listeners.delete(callback);
      }

      notify() {
        this.listeners.forEach(cb => cb({ ...this.state }));
      }

      setTargetDriverName(name) {
        if (!name) return;
        this.targetDriverName = String(name).trim();
        this.state.targetDriverName = this.targetDriverName;
        localStorage.setItem('kart_target_driver_name', this.targetDriverName);
        this.resolveTargetKart();
        this.notify();
      }

      setCircuit(circuitId) {
        if (!CIRCUITS[circuitId]) return;
        this.activeCircuitId = circuitId;
        this.state.activeCircuitId = circuitId;
        this.state.trackName = CIRCUITS[circuitId].name;
        this.state.sessionName = "Cambiando de circuito...";
        this.state.drivers = [];
        this.state.isLiveConnected = false;
        
        this.pollInit = 1;
        this.pollIndex = 0;
        this.pollCounter = 0;
        this.sessionRows.clear();
        
        localStorage.setItem('kart_active_circuit_id', circuitId);
        
        this.stop();
        this.start();
        this.notify();
      }

      resolveTargetKart() {
        if (!Array.isArray(this.state.drivers) || this.state.drivers.length === 0) return;
        const query = this.targetDriverName.toLowerCase();
        const matched = this.state.drivers.find(d => 
          d.name && d.name.toLowerCase().includes(query)
        );
        if (matched) {
          this.targetKart = matched.kartNumber;
          this.state.matchedKartNumber = matched.kartNumber;
        }
      }

      start() {
        if (this.pollTimerId) return;
        this.fetchRealApexData();
        // Jitter polling: 3s ± 500ms to avoid 6+ devices colliding on the same proxy
        const scheduleNext = () => {
          const jitter = Math.floor(Math.random() * 1000) - 500; // -500ms to +500ms
          const interval = Math.max(2000, 3000 + jitter);
          this.pollTimerId = setTimeout(() => {
            this.fetchRealApexData();
            scheduleNext();
          }, interval);
        };
        scheduleNext();
      }

      stop() {
        if (this.pollTimerId) {
          clearTimeout(this.pollTimerId);
          this.pollTimerId = null;
        }
      }

      parseTimeToMs(val) {
        if (val === undefined || val === null || val === '') return 0;
        if (typeof val === 'number') return val;
        
        const str = String(val).trim();
        if (str === '--.---' || str === '0' || str.toLowerCase().includes('l')) return 0;

        const clean = str.replace(/[^0-9:.]/g, '').trim();
        if (!clean) return 0;

        const parts = clean.split(':');
        if (parts.length === 2) {
          const min = parseFloat(parts[0]);
          const sec = parseFloat(parts[1]);
          if (!isNaN(min) && !isNaN(sec)) {
            return Math.round((min * 60 + sec) * 1000);
          }
        } else if (parts.length === 1) {
          const sec = parseFloat(parts[0]);
          if (!isNaN(sec)) {
            return Math.round(sec * 1000);
          }
        }
        return 0;
      }

      parseGapToMs(val) {
        if (val === undefined || val === null || val === '') return 0;
        const str = String(val).toLowerCase().trim();
        if (str === 'lider' || str === 'líder' || str === '0' || str === '--.---') return 0;
        const clean = str.replace(/[^0-9.]/g, '').trim();
        const sec = parseFloat(clean);
        if (!isNaN(sec)) {
          return Math.round(sec * 1000);
        }
        return 0;
      }

      async fetchRealApexData() {
        const circuit = CIRCUITS[this.activeCircuitId];
        const apiPort = circuit.configPort + 4;
        const targetUrl = `https://${this.configHost}/live-timing/commonv2/functions/live_ajax.php?version=1.0.0&init=${this.pollInit}&index=${this.pollIndex}&port=${apiPort}&counter=${this.pollCounter}&duration=100&id=${this.randomSessionId}&ignored=0`;

        for (let pi = 0; pi < this.corsProxies.length; pi++) {
          const proxyIdx = (this.activeProxyIndex + pi) % this.corsProxies.length;
          const proxyUrl = this.corsProxies[proxyIdx](targetUrl);
          
          try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 4000);

            const response = await fetch(proxyUrl, { signal: controller.signal });
            clearTimeout(timeoutId);

            if (!response.ok) continue;

            const dataText = await response.text();
            this.pollCounter += 1;

            if (dataText && dataText !== 'error' && !dataText.includes('<!DOCTYPE')) {
              const atIdx1 = dataText.indexOf('@');
              const atIdx2 = dataText.indexOf('@', atIdx1 + 1);
              
              if (atIdx1 > 0 && atIdx2 > atIdx1) {
                const newInit = parseInt(dataText.substring(0, atIdx1), 10);
                this.pollInit = newInit || this.pollInit;
                this.pollIndex = parseInt(dataText.substring(atIdx1 + 1, atIdx2), 10) || this.pollIndex;
                
                const payload = dataText.substring(atIdx2 + 1);
                this.activeProxyIndex = proxyIdx;
                this.processRawApexPayload(payload);
              }
              break;
            }
          } catch (err) {}
        }
      }

      processRawApexPayload(payload) {
        if (!payload || payload.trim() === '') return;

        const circuit = CIRCUITS[this.activeCircuitId];
        const colMap = circuit.columnMap;
        const lines = payload.split('\n');
        let hasUpdates = false;

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i].trim();
          if (!line) continue;

          const pipeIdx = line.indexOf('|');
          if (pipeIdx < 0) continue;

          const cellId = line.substring(0, pipeIdx);
          const rest = line.substring(pipeIdx + 1);
          const pipeIdx2 = rest.indexOf('|');
          const valueType = pipeIdx2 >= 0 ? rest.substring(0, pipeIdx2) : rest;
          const value = pipeIdx2 >= 0 ? rest.substring(pipeIdx2 + 1) : '';

          if (cellId === 'init') {
            this.sessionRows.clear();
            continue;
          }

          if (cellId === 'dyn1' || cellId === 'track') {
            const statusLower = value.toLowerCase();
            if (statusLower.includes('chequered') || statusLower.includes('cuadros') || statusLower.includes('finish') || statusLower.includes('finaliz')) {
              this.state.flagStatus = 'CHECKERED';
            } else if (statusLower.includes('red') || statusLower.includes('roja')) {
              this.state.flagStatus = 'RED';
            } else if (statusLower.includes('yellow') || statusLower.includes('amarilla')) {
              this.state.flagStatus = 'YELLOW';
            } else {
              this.state.flagStatus = 'GREEN';
            }
            continue;
          }

          if (cellId === 'grid') {
            try {
              const gridHtml = rest.substring(pipeIdx2 + 1);
              const tempDiv = document.createElement('div');
              tempDiv.innerHTML = '<table>' + gridHtml + '</table>';

              const rows = tempDiv.querySelectorAll('tr[data-id]');
              rows.forEach(row => {
                const rId = row.getAttribute('data-id');
                if (!rId || rId === 'r0') return;

                if (!this.sessionRows.has(rId)) {
                  this.sessionRows.set(rId, {
                    position: 0,
                    kartNumber: 0,
                    name: 'Piloto',
                    lastLapMs: 0,
                    bestLapMs: 0,
                    currentLap: 0,
                    gapLeaderMs: 0,
                    intervalAheadMs: 0
                  });
                }
                const entry = this.sessionRows.get(rId);

                row.querySelectorAll('[data-id]').forEach(el => {
                  const dataId = el.getAttribute('data-id');
                  if (!dataId || !dataId.startsWith(rId)) return;
                  const colSuffix = dataId.substring(rId.length);
                  const val = el.textContent.trim();
                  this.applyColumnValue(entry, colSuffix, val, colMap);
                });
              });
              hasUpdates = true;
            } catch(e) {}
            continue;
          }

          if (cellId.startsWith('r') && /^r\d+/.test(cellId)) {
            const match = cellId.match(/^(r\d+)(.+)$/);
            if (!match) continue;
            
            const rowId = match[1];
            const suffix = match[2];

            if (!this.sessionRows.has(rowId)) {
              this.sessionRows.set(rowId, {
                position: 0,
                kartNumber: 0,
                name: 'Piloto',
                lastLapMs: 0,
                bestLapMs: 0,
                currentLap: 0,
                gapLeaderMs: 0,
                intervalAheadMs: 0
              });
            }
            const entry = this.sessionRows.get(rowId);
            if (this.applyColumnValue(entry, suffix, value, colMap)) {
              hasUpdates = true;
            }
          }
        }

        if (hasUpdates) {
          this.state.isLiveConnected = true;
          this.state.drivers = Array.from(this.sessionRows.values())
            .filter(d => d.kartNumber > 0)
            .sort((a, b) => a.position - b.position);

          this.resolveTargetKart();

          for (let i = 0; i < this.state.drivers.length - 1; i++) {
            this.state.drivers[i].intervalBehindMs = this.state.drivers[i + 1].intervalAheadMs;
          }

          this.notify();
        }
      }

      applyColumnValue(entry, colSuffix, value, colMap) {
        if (!colSuffix) return false;
        
        if (colSuffix === 'c1' || colSuffix === 'c2' || colSuffix === 'c3') {
          const pos = parseInt(value.replace(/[^\d]/g, ''), 10);
          if (!isNaN(pos)) {
            entry.position = pos;
            return true;
          }
        }
        if (colSuffix === colMap.no) {
          const kn = parseInt(value.replace(/[^\d]/g, ''), 10);
          if (!isNaN(kn)) {
            entry.kartNumber = kn;
            return true;
          }
        }
        if (colSuffix === colMap.dr) {
          entry.name = value.replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ').trim();
          return true;
        }
        if (colSuffix === colMap.llp) {
          entry.lastLapMs = this.parseTimeToMs(value);
          return true;
        }
        if (colSuffix === colMap.blp) {
          entry.bestLapMs = this.parseTimeToMs(value);
          return true;
        }
        if (colSuffix === colMap.tlp) {
          const l = parseInt(value.replace(/[^\d]/g, ''), 10);
          if (!isNaN(l)) {
            entry.currentLap = l;
            return true;
          }
        }
        if (colSuffix === colMap.gap) {
          entry.gapLeaderMs = this.parseGapToMs(value);
          return true;
        }
        if (colSuffix === colMap.int) {
          entry.intervalAheadMs = this.parseGapToMs(value);
          return true;
        }
        return false;
      }

      formatTime(ms) {
        if (!ms || ms <= 0) return "--:--.---";
        const minutes = Math.floor(ms / 60000);
        const seconds = Math.floor((ms % 60000) / 1000);
        const millis = ms % 1000;
        const secStr = seconds < 10 ? `0${seconds}` : `${seconds}`;
        const msStr = millis.toString().padStart(3, '0');
        if (minutes > 0) return `${minutes}:${secStr}.${msStr}`;
        return `${secStr}.${msStr}`;
      }

      formatGap(ms) {
        if (ms === 0) return "LÍDER";
        if (!ms || ms < 0) return "+0.000";
        return `+${(ms / 1000).toFixed(3)}s`;
      }
    }

    const apexTimingService = new ApexTimingService();

    // =========================================================================
    // 2. TIMING MODAL (EMBEDDED OFFICIAL TIMING IFRAME - DYNAMIC BY SELECTED TRACK)
    // =========================================================================
    function TimingModal({ isOpen, onClose, activeCircuitId }) {
      if (!isOpen) return null;
      const circuit = CIRCUITS[activeCircuitId] || CIRCUITS["lucas-guerrero"];
      const apexUrl = circuit.url;

      return (
        <div className="fixed inset-0 z-50 bg-black/95 backdrop-blur-md flex flex-col w-screen h-screen overflow-hidden safe-area-inset">
          <header className="w-full py-1.5 px-3 bg-[#0A0A0C] border-b border-gray-800 flex justify-between items-center z-10 shrink-0 h-10 font-mono">
            <div className="flex items-center gap-2">
              <span className="w-2.5 h-2.5 rounded-full bg-[#00FF66] animate-pulse"></span>
              <h3 className="text-xs md:text-sm font-extrabold uppercase tracking-wider text-white">APEX TIMING - {circuit.name.toUpperCase()}</h3>
            </div>
            <div className="flex items-center gap-2">
              <a href={apexUrl} target="_blank" rel="noopener noreferrer" className="px-2.5 py-1 bg-gray-800 hover:bg-gray-700 rounded text-[11px] text-gray-300 font-bold hidden xs:inline">↗️ PESTAÑA</a>
              <button onClick={onClose} className="px-3 py-1 bg-red-600 hover:bg-red-500 text-white rounded text-xs font-black tracking-wider shadow-lg">✕ CERRAR</button>
            </div>
          </header>
          <div className="flex-1 w-full h-full bg-black relative overflow-hidden">
            <iframe src={apexUrl} title="Apex Timing Live" className="w-full h-full border-0 bg-black" allow="fullscreen" />
          </div>
        </div>
      );
    }

    // =========================================================================
    // 3. SETTINGS MODAL (REGISTER TARGET RACING NAME)
    // =========================================================================
    function SettingsModal({ isOpen, onClose, targetDriverName, onSaveDriverName }) {
      if (!isOpen) return null;
      const [inputName, setInputName] = useState(targetDriverName || 'Alex R.');

      const handleSave = () => {
        if (inputName.trim()) onSaveDriverName(inputName.trim());
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 safe-area-inset font-mono">
          <div className="w-full max-w-md bg-[#0A0A0C] border-2 border-gray-800 rounded-2xl p-4 shadow-2xl flex flex-col gap-4 text-white">
            <div className="flex justify-between items-center border-b border-gray-800 pb-2.5">
              <div className="flex items-center gap-2">
                <span className="text-lg">🏎️</span>
                <h3 className="text-sm font-extrabold uppercase tracking-wider text-[#00FF66]">CONFIGURACIÓN DE PILOTO</h3>
              </div>
              <button onClick={onClose} className="text-gray-400 hover:text-white text-lg font-bold">✕</button>
            </div>
            <div className="flex flex-col gap-2">
              <label className="text-xs text-gray-300 font-black uppercase tracking-wider">TU NOMBRE DE PILOTO / COMPETIDOR</label>
              <input 
                type="text" 
                placeholder="Ej: Alex Rodríguez" 
                value={inputName} 
                onChange={(e) => setInputName(e.target.value)}
                className="bg-black border-2 border-gray-800 rounded-xl p-3 text-sm text-[#00FF66] font-bold focus:border-[#00FF66] outline-none shadow-inner"
              />
              <p className="text-[11px] text-gray-400 leading-normal">
                💡 La app buscará automáticamente tu nombre en el timing en vivo y vinculará tu kart, posición y tiempos.
              </p>
            </div>
            <div className="flex gap-2 pt-2">
              <button onClick={onClose} className="flex-1 py-2.5 rounded-xl border border-gray-800 text-xs font-bold text-gray-400 hover:bg-gray-800">CANCELAR</button>
              <button onClick={handleSave} className="flex-1 py-2.5 rounded-xl bg-[#00FF66] text-black text-xs font-black hover:bg-emerald-400 shadow-lg uppercase tracking-wider">GUARDAR</button>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 4. PITBOARD HUD COMPONENT (DECOUPLED MEDIA QUERIES FOR PHYSICAL ROTATION LOCK)
    // =========================================================================
    function PitboardHUD({ state, targetDriverName, isLocked, isViewportPortrait, onToggleLock, onChangeCircuit, onOpenTiming, onOpenSettings }) {
      const hasDrivers = Array.isArray(state.drivers) && state.drivers.length > 0;
      const currentTargetName = targetDriverName || 'Alex R.';

      const matchedIndex = hasDrivers 
        ? state.drivers.findIndex(d => d.name && d.name.toLowerCase().includes(currentTargetName.toLowerCase()))
        : -1;

      // CAMBIO 3: Nunca usar drivers[0] como fallback — solo mostrar datos del piloto configurado
      const driver = matchedIndex !== -1 ? state.drivers[matchedIndex] : null;
      const driverAhead = (matchedIndex > 0 && hasDrivers) ? state.drivers[matchedIndex - 1] : null;
      const driverBehind = (matchedIndex >= 0 && matchedIndex < state.drivers.length - 1 && hasDrivers) ? state.drivers[matchedIndex + 1] : null;
      const isLeader = driver ? driver.position === 1 : false;

      // CAMBIO 2: Cuando es líder, obtener P2 y P3 para mostrar sus gaps
      const p2Driver = (isLeader && hasDrivers && state.drivers.length > 1) ? state.drivers[1] : null;
      const p3Driver = (isLeader && hasDrivers && state.drivers.length > 2) ? state.drivers[2] : null;

      // Estado de búsqueda: hay datos en el timing pero el piloto no aparece
      const isSearching = hasDrivers && !driver && state.isLiveConnected;

      const deltaLastVsBest = driver ? (driver.lastLapMs - driver.bestLapMs) : 0;
      const deltaFormatted = !driver || driver.lastLapMs === 0
        ? "--:--" 
        : deltaLastVsBest === 0 
          ? "RÉCORD" 
          : deltaLastVsBest > 0 
            ? `+${(deltaLastVsBest / 1000).toFixed(3)}`
            : `-${(Math.abs(deltaLastVsBest) / 1000).toFixed(3)}`;

      // We determine visual layout (landscape mode) based on orientation locks
      const isLandscapeLayout = !isViewportPortrait || isLocked;

      const handleToggleFullscreen = (evt) => {
        if (evt.target.closest('button') || evt.target.closest('a') || evt.target.closest('select')) return;
        const doc = document.documentElement;
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
          if (doc.requestFullscreen) doc.requestFullscreen().catch(() => {});
          else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen();
        }
      };

      return (
        <div 
          onClick={handleToggleFullscreen} 
          className="w-full h-full bg-black text-white p-2 md:p-3 flex flex-col justify-between overflow-hidden select-none safe-area-inset cursor-pointer"
        >
          
          {/* HEADER BAR */}
          <div className="w-full py-1.5 px-2.5 sm:px-3 bg-[#0A0A0E] border-2 border-gray-800 rounded-xl mb-1.5 sm:mb-2 flex items-center justify-between font-mono shadow-xl shrink-0 h-12 z-20">
            
            {/* DYNAMIC CIRCUIT SELECTOR DROPDOWN */}
            <div className="flex items-center gap-1.5 sm:gap-2 overflow-hidden max-w-[52%]">
              <span className="w-2.5 h-2.5 rounded-full bg-[#00FF66] animate-pulse shrink-0"></span>
              <select 
                value={state.activeCircuitId} 
                onChange={(e) => { e.stopPropagation(); onChangeCircuit(e.target.value); }}
                className="bg-black border border-gray-800 rounded-lg px-1.5 py-1 text-white text-xs sm:text-sm font-extrabold focus:border-[#00FF66] outline-none cursor-pointer truncate"
              >
                {Object.values(CIRCUITS).map(c => (
                  <option key={c.id} value={c.id} className="bg-black text-white font-mono font-bold">{c.name}</option>
                ))}
              </select>
            </div>
            
            {/* TIMING & LOCK CONTROLS */}
            <div className="flex items-center gap-1.5 sm:gap-2 shrink-0 z-30">
              {/* LOCK BUTTON (LOCK LAYOUT IN LANDSCAPE PHYSICALLY) */}
              <button
                type="button"
                onClick={(e) => { e.stopPropagation(); onToggleLock(); }}
                className={`p-1.5 rounded-lg border transition-all active:scale-95 cursor-pointer flex items-center justify-center text-xs ${
                  isLocked 
                    ? 'bg-yellow-600/20 border-yellow-500 text-yellow-300 shadow-[0_0_10px_rgba(234,179,8,0.25)]' 
                    : 'bg-gray-900 border-gray-800 text-gray-400 hover:text-white'
                }`}
                title={isLocked ? 'Orientación Horizontal Bloqueada' : 'Bloquear en Horizontal'}
              >
                <span className="mr-1 text-xs">{isLocked ? '🔒' : '🔓'}</span>
                <span className="hidden sm:inline font-bold uppercase tracking-wider text-[10px]">
                  {isLocked ? 'HORIZ. FIJO' : 'BLOQUEAR'}
                </span>
              </button>

              <button 
                type="button" 
                onClick={(e) => { e.stopPropagation(); onOpenTiming(); }}
                className="px-2.5 sm:px-3 py-1.5 bg-[#00FF66] text-black font-mono font-black text-[11px] sm:text-xs md:text-sm rounded-lg shadow-xl hover:bg-emerald-400 active:scale-95 transition-all flex items-center gap-1 cursor-pointer border border-emerald-300"
              >
                <span className="text-xs">⏱️</span>
                <span className="uppercase tracking-wider font-black">TIMING</span>
              </button>

              <button 
                type="button" 
                onClick={(e) => { e.stopPropagation(); onOpenSettings(); }}
                className="p-1.5 bg-gray-900 border border-gray-800 text-gray-300 hover:text-white rounded-lg text-xs transition-colors cursor-pointer"
              >
                ⚙️
              </button>
            </div>
          </div>

          {/* TELEMETRY GRID */}
          <div className={`w-full flex-1 ${isLandscapeLayout ? 'grid grid-cols-12 gap-2 overflow-hidden' : 'flex flex-col justify-around gap-2 overflow-hidden py-1 max-w-md mx-auto my-auto'}`}>
            
            {/* ROW 1: POSICIÓN Y VUELTAS (2 EQUAL 50/50 CARDS IN PORTRAIT, COL-SPAN-3 IN LANDSCAPE) */}
            <div className={`${isLandscapeLayout ? 'col-span-3 flex flex-col gap-2 h-full' : 'grid grid-cols-2 gap-2 w-full min-h-[110px]'}`}>
              
              {/* CARD: POSICIÓN */}
              <div className="bg-[#0A0A0E] border-2 border-gray-800 rounded-2xl p-2.5 flex flex-col justify-between items-center text-center shadow-2xl relative h-full min-h-[110px]">
                <span className="text-gray-400 font-black text-[10px] uppercase tracking-widest">POSICIÓN</span>
                {isSearching ? (
                  <div className="my-auto flex flex-col items-center gap-0.5">
                    <span className="text-3xl font-black font-mono text-gray-600 animate-pulse">--</span>
                    <span className="text-[9px] font-mono text-yellow-400 font-bold animate-pulse">🔍 Buscando...</span>
                  </div>
                ) : (
                  <div className="my-1 flex items-baseline justify-center">
                    <span className="text-lg font-black font-mono text-gray-500 mr-0.5">P</span>
                    <span className={`text-4xl font-black font-mono leading-none ${isLeader ? 'text-yellow-400' : 'text-[#00FF66]'}`}>
                      {driver ? driver.position : '--'}
                    </span>
                  </div>
                )}
                <div className="flex flex-col items-center gap-0.5 w-full">
                  <span className="text-xs font-mono text-white font-extrabold truncate max-w-full px-1">{driver ? driver.name : currentTargetName}</span>
                  <span className="text-[9px] font-mono text-gray-300 font-bold bg-white/10 px-2 py-0.5 rounded-md">
                    {driver ? `KART #${driver.kartNumber}` : 'SIN KART'}
                  </span>
                </div>
              </div>

              {/* CARD: TOTAL VUELTAS */}
              <div className="bg-[#0A0A0E] border-2 border-gray-800 rounded-2xl p-2.5 flex flex-col justify-between items-center text-center shadow-2xl h-full min-h-[110px]">
                <span className="text-gray-400 font-black text-[10px] uppercase tracking-widest">VUELTAS</span>
                <div className="my-1 flex items-baseline justify-center gap-0.5 font-mono font-black">
                  <span className="text-3xl text-white">{driver ? driver.currentLap : '0'}</span>
                  <span className="text-xs text-gray-500">/{state.totalLaps || '--'}</span>
                </div>
                <div className="w-full flex justify-center">
                  <span className="text-[9px] font-mono text-emerald-400 font-bold bg-emerald-500/10 border border-emerald-500/20 px-2 py-0.5 rounded-md uppercase tracking-wider">
                    EN PISTA
                  </span>
                </div>
              </div>

            </div>

            {/* ROW 2: GAP E INTERVALOS (FULL WIDTH IN PORTRAIT, COL-SPAN-5 IN LANDSCAPE) */}
            <div className={`bg-[#0A0A0E] border-2 border-gray-800 rounded-2xl p-2.5 flex flex-col justify-between shadow-2xl ${isLandscapeLayout ? 'col-span-5 h-full' : 'w-full py-2.5 my-1 min-h-[160px]'}`}>
              <span className="text-gray-400 font-black text-[10px] uppercase tracking-widest text-center border-b border-gray-800 pb-1">GAP E INTERVALOS (SEG)</span>
              
              <div className="flex-1 flex flex-col justify-around py-1 font-mono gap-1.5">
                
                {/* FILA 1: GAP LÍDER */}
                <div className="flex justify-between items-center bg-black/80 px-3 py-2 rounded-xl border border-gray-800">
                  <div className="flex flex-col text-left">
                    <span className="text-xs font-bold text-gray-400">GAP (LÍDER)</span>
                    <span className="text-[9px] text-gray-500 truncate max-w-[100px]">{isLeader && driver ? driver.name : 'Diferencia total'}</span>
                  </div>
                  <span className={`text-lg sm:text-2xl font-black ${isLeader ? 'text-yellow-400' : 'text-white'}`}>
                    {driver ? (isLeader ? 'LÍDER' : apexTimingService.formatGap(driver.gapLeaderMs)) : '--:--'}
                  </span>
                </div>

                {/* FILA 2: Si es líder → P2. Si no → intervalo delante */}
                {isLeader ? (
                  <div className="flex justify-between items-center bg-black/80 px-3 py-2 rounded-xl border border-cyan-800/50">
                    <div className="flex flex-col text-left">
                      <span className="text-xs font-bold text-cyan-400">{p2Driver ? `P2 · #${p2Driver.kartNumber}` : 'P2'}</span>
                      <span className="text-[9px] text-cyan-600 truncate max-w-[100px]">{p2Driver ? p2Driver.name : 'Sin datos'}</span>
                    </div>
                    <span className="text-lg sm:text-2xl font-black text-cyan-400">
                      {p2Driver ? apexTimingService.formatGap(p2Driver.gapLeaderMs) : '---'}
                    </span>
                  </div>
                ) : (
                  <div className="flex justify-between items-center bg-black/80 px-3 py-2 rounded-xl border border-gray-800">
                    <div className="flex flex-col text-left">
                      <span className="text-xs font-bold text-[#00FF66]">{driverAhead ? `INTERVALO ▲ #${driverAhead.kartNumber}` : 'INTERVALO DELANTE'}</span>
                      <span className="text-[9px] text-gray-500 truncate max-w-[100px]">{driverAhead ? driverAhead.name : 'Kart anterior'}</span>
                    </div>
                    <span className="text-lg sm:text-2xl font-black text-[#00FF66]">
                      {driverAhead ? apexTimingService.formatGap(driver.intervalAheadMs) : '---'}
                    </span>
                  </div>
                )}

                {/* FILA 3: Si es líder → P3. Si no → intervalo detrás */}
                {isLeader ? (
                  <div className="flex justify-between items-center bg-black/80 px-3 py-2 rounded-xl border border-orange-800/50">
                    <div className="flex flex-col text-left">
                      <span className="text-xs font-bold text-orange-400">{p3Driver ? `P3 · #${p3Driver.kartNumber}` : 'P3'}</span>
                      <span className="text-[9px] text-orange-600 truncate max-w-[100px]">{p3Driver ? p3Driver.name : 'Sin datos'}</span>
                    </div>
                    <span className="text-lg sm:text-2xl font-black text-orange-400">
                      {p3Driver ? apexTimingService.formatGap(p3Driver.gapLeaderMs) : '---'}
                    </span>
                  </div>
                ) : (
                  <div className="flex justify-between items-center bg-black/80 px-3 py-2 rounded-xl border border-gray-800">
                    <div className="flex flex-col text-left">
                      <span className="text-xs font-bold text-red-400">{driverBehind ? `INTERVALO ▼ #${driverBehind.kartNumber}` : 'INTERVALO DETRÁS'}</span>
                      <span className="text-[9px] text-gray-500 truncate max-w-[100px]">{driverBehind ? driverBehind.name : 'Kart posterior'}</span>
                    </div>
                    <span className="text-lg sm:text-2xl font-black text-red-400">
                      {driverBehind ? apexTimingService.formatGap(driver.intervalBehindMs) : '---'}
                    </span>
                  </div>
                )}

              </div>
            </div>

            {/* ROW 3: ÚLTIMA VUELTA Y MEJOR VUELTA (2 EQUAL 50/50 CARDS IN PORTRAIT, COL-SPAN-4 IN LANDSCAPE) */}
            <div className={`${isLandscapeLayout ? 'col-span-4 flex flex-col gap-2 h-full' : 'grid grid-cols-2 gap-2 w-full min-h-[95px]'}`}>
              
              {/* CARD: ÚLTIMA VUELTA */}
              <div className="bg-[#0A0A0E] border-2 border-gray-800 rounded-2xl p-2.5 flex flex-col justify-between items-center text-center shadow-2xl h-full min-h-[95px]">
                <div className="w-full flex justify-between items-center">
                  <span className="text-gray-400 font-black text-[10px] uppercase tracking-widest">ÚLTIMA</span>
                  <span className={`text-[10px] font-mono font-black ${deltaLastVsBest <= 0 ? 'text-[#00FF66]' : 'text-yellow-400'}`}>{deltaFormatted}</span>
                </div>
                <div className="my-auto flex items-center justify-center">
                  <span className="text-xl sm:text-2xl font-black font-mono text-white tracking-tighter">
                    {driver ? apexTimingService.formatTime(driver.lastLapMs) : '--:--.---'}
                  </span>
                </div>
              </div>

              {/* CARD: MEJOR VUELTA */}
              <div className="bg-[#0A0A0E] border-2 border-purple-600/50 rounded-2xl p-2.5 flex flex-col justify-between items-center text-center shadow-2xl h-full min-h-[95px]">
                <div className="w-full flex justify-between items-center">
                  <span className="text-gray-400 font-black text-[10px] uppercase tracking-widest">MEJOR</span>
                  <span className="text-[9px] px-1.5 py-0.5 rounded font-mono font-bold bg-purple-600/20 text-purple-300 border border-purple-500/30">
                    BEST
                  </span>
                </div>
                <div className="my-auto flex items-center justify-center">
                  <span className="text-xl sm:text-2xl font-black font-mono text-purple-400 tracking-tighter">
                    {driver ? apexTimingService.formatTime(driver.bestLapMs) : '--:--.---'}
                  </span>
                </div>
              </div>

            </div>

          </div>
        </div>
      );
    }

    // =========================================================================
    // 5. MAIN CONTAINER / COORDINATOR (INCLUDES PHYSICAL CSS ROTATION LOCK)
    // =========================================================================
    function App() {
      const [timingState, setTimingState] = useState(apexTimingService.state);
      const [targetDriverName, setTargetDriverName] = useState(apexTimingService.targetDriverName);
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [isTimingOpen, setIsTimingOpen] = useState(false);
      
      // Orientation Lock states
      const [isOrientationLocked, setIsOrientationLocked] = useState(
        localStorage.getItem('kart_orientation_locked') === 'true'
      );
      const [isViewportPortrait, setIsViewportPortrait] = useState(
        window.innerHeight > window.innerWidth
      );

      useEffect(() => {
        const unsubscribe = apexTimingService.subscribe((newState) => {
          setTimingState(newState);
        });
        apexTimingService.start();

        const handleResize = () => {
          setIsViewportPortrait(window.innerHeight > window.innerWidth);
        };
        window.addEventListener('resize', handleResize);
        window.addEventListener('orientationchange', handleResize);

        // Apply native lock where supported
        if (isOrientationLocked) {
          if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('landscape').catch(() => {});
          }
        }

        return () => {
          unsubscribe();
          apexTimingService.stop();
          window.removeEventListener('resize', handleResize);
          window.removeEventListener('orientationchange', handleResize);
        };
      }, [isOrientationLocked]);

      const handleSaveDriverName = (name) => {
        setTargetDriverName(name);
        apexTimingService.setTargetDriverName(name);
      };

      const handleChangeCircuit = (circuitId) => {
        apexTimingService.setCircuit(circuitId);
      };

      const handleToggleOrientationLock = () => {
        const newLockState = !isOrientationLocked;
        setIsOrientationLocked(newLockState);
        localStorage.setItem('kart_orientation_locked', String(newLockState));

        if (newLockState) {
          if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('landscape').catch(() => {});
          }
        } else {
          if (screen.orientation && screen.orientation.unlock) {
            screen.orientation.unlock();
          }
        }
      };

      // Hardware rotation block: If lock is active and phone is turned to portrait,
      // we rotate the content container by 90deg using CSS transforms to keep it landscape!
      const shouldApplyPhysicalRotation = isOrientationLocked && isViewportPortrait;

      const containerStyle = shouldApplyPhysicalRotation
        ? {
            position: 'absolute',
            top: 0,
            left: '100%',
            width: '100vh',
            height: '100vw',
            transform: 'rotate(90deg)',
            transformOrigin: 'top left',
            overflow: 'hidden'
          }
        : {
            width: '100%',
            height: '100%',
            overflow: 'hidden'
          };

      return (
        <div style={containerStyle} className="relative">
          {/* Main Dashboard HUD */}
          <PitboardHUD 
            state={timingState} 
            targetDriverName={targetDriverName} 
            isLocked={isOrientationLocked}
            isViewportPortrait={isViewportPortrait}
            onToggleLock={handleToggleOrientationLock}
            onChangeCircuit={handleChangeCircuit}
            onOpenTiming={() => setIsTimingOpen(true)}
            onOpenSettings={() => setIsSettingsOpen(true)}
          />
          <SettingsModal 
            isOpen={isSettingsOpen} 
            onClose={() => setIsSettingsOpen(false)} 
            targetDriverName={targetDriverName}
            onSaveDriverName={handleSaveDriverName}
          />
          <TimingModal 
            isOpen={isTimingOpen} 
            onClose={() => setIsTimingOpen(false)} 
            activeCircuitId={timingState.activeCircuitId}
          />
        </div>
      );
    }

    // Mount App
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
